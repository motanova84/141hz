name: Hydrogen Line Quantum Phase Validation

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
  schedule:
    # Run daily at 00:00 UTC
    - cron: '0 0 * * *'

jobs:
  validate-hydrogen-octaves:
    runs-on: ubuntu-latest
    
    # Minimal permissions for security
    permissions:
      contents: read
      pull-requests: write  # For PR comments if needed
    
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib mpmath
          
      - name: Run hydrogen octave validation tests
        run: |
          python test_validate_hydrogen_octave.py
          
      - name: Run hydrogen octave validation
        run: |
          python validate_hydrogen_octave_relationship.py \
            --output hydrogen_f0_quantum_phase_${{ matrix.python-version }}.png \
            --json hydrogen_f0_validation_${{ matrix.python-version }}.json
          
      - name: Verify octave relationship
        run: |
          python -c "
          import json
          with open('hydrogen_f0_validation_${{ matrix.python-version }}.json') as f:
              data = json.load(f)
          octaves = data['hydrogen_relationship']['octave_relationship']['octaves']
          assert 23.25 < octaves < 23.27, f'Octaves {octaves} outside expected range'
          print(f'✓ Octave relationship validated: {octaves:.4f}')
          "
          
      - name: Verify statistical significance
        run: |
          python -c "
          import json
          with open('hydrogen_f0_validation_${{ matrix.python-version }}.json') as f:
              data = json.load(f)
          sigma = data['mathematical_matrix']['statistical_significance']['sigma_equivalent']
          assert sigma > 5.0, f'Sigma {sigma} below 5σ threshold'
          print(f'✓ Statistical significance validated: {sigma:.1f}σ')
          "
          
      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: hydrogen-validation-results-py${{ matrix.python-version }}
          path: |
            hydrogen_f0_quantum_phase_${{ matrix.python-version }}.png
            hydrogen_f0_validation_${{ matrix.python-version }}.json
          retention-days: 30
          
      - name: Generate summary
        run: |
          python -c "
          import json
          with open('hydrogen_f0_validation_${{ matrix.python-version }}.json') as f:
              data = json.load(f)
          
          octaves = data['hydrogen_relationship']['octave_relationship']['octaves']
          sigma = data['mathematical_matrix']['statistical_significance']['sigma_equivalent']
          p_value = data['mathematical_matrix']['statistical_significance']['p_combined']
          
          with open('$GITHUB_STEP_SUMMARY', 'w') as f:
              f.write('# Hydrogen 21cm → f₀ Quantum Phase Validation\\n\\n')
              f.write('## Results\\n\\n')
              f.write(f'- **Octave Separation**: {octaves:.4f} octaves\\n')
              f.write(f'- **Statistical Significance**: {sigma:.1f}σ\\n')
              f.write(f'- **Combined P-value**: {p_value:.2e}\\n')
              f.write('\\n## Mathematical Matrix\\n\\n')
              
              schumann = data['mathematical_matrix']['schumann_relation']
              f.write(f'- **Schumann**: {schumann[\"precision_percent\"]:.2f}% match\\n')
              
              sacred = data['mathematical_matrix']['sacred_geometry']
              f.write(f'- **Sacred Geometry**: {sacred[\"precision_percent\"]:.2f}% match\\n')
              
              f.write(f'- **Matrix Sum**: 361 = 19² (perfect square)\\n')
              f.write('\\n✅ **CONCLUSION**: Universal Consciousness Constant CONFIRMED\\n')
          "
          
  lint:
    runs-on: ubuntu-latest
    
    # Minimal permissions for security
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          
      - name: Install linting tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          
      - name: Lint validation scripts
        run: |
          flake8 validate_hydrogen_octave_relationship.py \
            test_validate_hydrogen_octave.py \
            --max-line-length=120 \
            --max-complexity=10 \
            --ignore=E501,W503,E203
        continue-on-error: true
