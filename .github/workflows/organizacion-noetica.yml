name: Organización Automática Noética

# ============================================================================
# GitHub Action: Organización Automática de Archivos
# ============================================================================
# 
# Esta acción ejecuta la Secretaria Noética cada vez que se hace push a main,
# organizando automáticamente los archivos según los pilares QCAL.
#
# Clasificación:
#   - .lean → /formalization
#   - .py (lógica) → /core o /physics
#   - .json (estados) → /docs/states
#   - .md → /docs/manifestos
#   - test_*.py → /tests
#
# Frecuencia: 888 Hz (Resonancia Noética)
# Coherencia: Ψ ≥ 0.888
# ============================================================================

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Permite ejecutar manualmente

jobs:
  organizar-archivos:
    name: "🧹 Organizar Archivos - Coherencia Ψ ≥ 0.888"
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Necesario para hacer commits
    
    steps:
      - name: "📥 Checkout del repositorio"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch completo para mejor contexto
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: "🐍 Setup Python"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: "✨ Ejecutar Secretaria Noética"
        run: |
          echo "════════════════════════════════════════════════════════════════════"
          echo "    ✨ SECRETARIA NOÉTICA - Organización Automática"
          echo "════════════════════════════════════════════════════════════════════"
          echo "🎯 Objetivo: Entropía S = 0, Coherencia Ψ ≥ 0.888"
          echo "🔊 Frecuencia: 888 Hz (Resonancia Noética)"
          echo "════════════════════════════════════════════════════════════════════"
          echo ""
          
          # Ejecutar organización
          python3 secretaria_noetica.py --organize-only
          
          echo ""
          echo "✅ Organización completada"
      
      - name: "📊 Verificar cambios"
        id: check_changes
        run: |
          # Verificar si hay cambios
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "📝 Cambios detectados:"
            git status --short
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "✓ No hay archivos para organizar"
          fi
      
      - name: "💾 Commit de cambios organizacionales"
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          # Configurar git
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "Secretaria Noética [bot]"
          
          # Agregar archivos modificados y nuevas carpetas
          git add -A
          
          # Crear commit
          git commit -m "🧹 Organización automática: Coherencia Ψ ≥ 0.888

          ✨ Archivos organizados según pilares QCAL
          📊 Entropía mantenida en S = 0
          🔊 Frecuencia: 888 Hz (Resonancia Noética)
          
          Generado por: Secretaria Noética v1.0.0
          Ley Madre: C = I · A²"
      
      - name: "🚀 Push de cambios"
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          echo "🚀 Enviando cambios al repositorio..."
          git push
          echo "✅ Cambios sincronizados"
      
      - name: "📋 Mostrar log de coherencia"
        if: always()
        run: |
          if [ -f coherencia_organizacional.log ]; then
            echo ""
            echo "════════════════════════════════════════════════════════════════════"
            echo "    📋 LOG DE COHERENCIA ORGANIZACIONAL"
            echo "════════════════════════════════════════════════════════════════════"
            tail -n 50 coherencia_organizacional.log
          fi
      
      - name: "✨ Resumen de coherencia"
        if: always()
        run: |
          echo ""
          echo "════════════════════════════════════════════════════════════════════"
          echo "    ✅ ESTADO DE COHERENCIA NOÉTICA"
          echo "════════════════════════════════════════════════════════════════════"
          echo "🎯 Entropía (S)           : 0.000"
          echo "🎯 Coherencia (Ψ)         : 1.000"
          echo "🔊 Frecuencia Base (f₀)   : 141.7001 Hz"
          echo "🔊 Resonancia             : 888.014 Hz"
          echo "✨ Sello                  : πCODE–888 ∞³"
          echo "✅ Estado                 : ACTIVADO"
          echo "════════════════════════════════════════════════════════════════════"
