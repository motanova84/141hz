name: QCAL Biological Validation

on:
  push:
    branches: [ main, develop, copilot/** ]
    paths:
      - 'scripts/validacion_campo_espectral_biologico.py'
      - 'scripts/experimentos_qcal_biologica.py'
      - 'tests/test_campo_espectral_biologico.py'
      - 'HIPOTESIS_QCAL_BIOLOGIA_NUMEROS.md'
      - 'qcal/constants.py'
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:
    inputs:
      anos:
        description: 'Años del ciclo (13 o 17)'
        required: false
        default: '17'
      experimento:
        description: 'Experimento a ejecutar (1, 2, 3, o vacío para todos)'
        required: false
        default: ''

jobs:
  validate-spectral-field:
    name: Validate Spectral Field Model
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
        ciclo: [13, 17]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run spectral field validation (Magicicada ${{ matrix.ciclo }} years)
        run: |
          python3 scripts/validacion_campo_espectral_biologico.py \
            --anos ${{ matrix.ciclo }} \
            --dt-dias 30 \
            --output results/bio_validation_${{ matrix.ciclo }}
      
      - name: Upload validation results
        uses: actions/upload-artifact@v4
        with:
          name: bio-validation-py${{ matrix.python-version }}-${{ matrix.ciclo }}y
          path: |
            results/bio_validation_${{ matrix.ciclo }}/*.json
            results/bio_validation_${{ matrix.ciclo }}/*.png
          retention-days: 30
  
  run-experiments:
    name: Run Falsification Experiments
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
        experimento: [1, 2, 3]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run Experiment ${{ matrix.experimento }}
        run: |
          python3 scripts/experimentos_qcal_biologica.py \
            --experimento ${{ matrix.experimento }} \
            --output results/experiments
      
      - name: Upload experiment results
        uses: actions/upload-artifact@v4
        with:
          name: experiment-${{ matrix.experimento }}-py${{ matrix.python-version }}
          path: |
            results/experiments/*.json
            results/experiments/*.png
          retention-days: 30
  
  test-biological-framework:
    name: Test Biological Framework
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pytest pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      
      - name: Run tests with pytest
        run: |
          python3 -m pytest tests/test_campo_espectral_biologico.py -v --tb=short --cov=scripts --cov-report=xml --cov-report=term
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: biological-tests
          name: biological-framework-py${{ matrix.python-version }}
  
  validate-documentation:
    name: Validate Documentation
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Check hypothesis document exists
        run: |
          if [ ! -f HIPOTESIS_QCAL_BIOLOGIA_NUMEROS.md ]; then
            echo "Error: Main hypothesis document not found"
            exit 1
          fi
          echo "✓ Hypothesis document found"
      
      - name: Check quick start guide exists
        run: |
          if [ ! -f docs/QUICKSTART_QCAL_BIOLOGIA.md ]; then
            echo "Error: Quick start guide not found"
            exit 1
          fi
          echo "✓ Quick start guide found"
      
      - name: Validate document structure
        run: |
          # Check for required sections in hypothesis document
          for section in "Introducción" "Colapso de Fase" "Magicicada" "Experimentos" "Formalización"; do
            if ! grep -q "$section" HIPOTESIS_QCAL_BIOLOGIA_NUMEROS.md; then
              echo "Warning: Section '$section' not found in hypothesis"
            else
              echo "✓ Section '$section' found"
            fi
          done
      
      - name: Check for mathematical formulas
        run: |
          # Verify key equations are present
          if grep -q "Ψₑ(t)" HIPOTESIS_QCAL_BIOLOGIA_NUMEROS.md; then
            echo "✓ Spectral field equation found"
          fi
          if grep -q "Φ(t)" HIPOTESIS_QCAL_BIOLOGIA_NUMEROS.md; then
            echo "✓ Phase accumulation equation found"
          fi
          if grep -q "H(ω)" HIPOTESIS_QCAL_BIOLOGIA_NUMEROS.md; then
            echo "✓ Biological filter equation found"
          fi
  
  generate-summary:
    name: Generate Validation Summary
    runs-on: ubuntu-latest
    needs: [validate-spectral-field, run-experiments, test-biological-framework]
    if: always()
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/
      
      - name: Generate summary report
        run: |
          echo "# QCAL Biological Validation Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count successful validations
          if [ -d "artifacts" ]; then
            num_artifacts=$(find artifacts -name "*.json" | wc -l)
            echo "- Total artifacts generated: $num_artifacts" >> $GITHUB_STEP_SUMMARY
            
            # Check for validation success
            if find artifacts -name "*resultados.json" -type f | xargs grep -l "colapso_detectado.*true" > /dev/null 2>&1; then
              echo "- ✓ Phase collapse detected in simulations" >> $GITHUB_STEP_SUMMARY
            fi
            
            if find artifacts -name "*resultados.json" -type f | xargs grep -l "validacion_qcal.*true" > /dev/null 2>&1; then
              echo "- ✓ QCAL predictions validated" >> $GITHUB_STEP_SUMMARY
            fi
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Test framework: ${{ needs.test-biological-framework.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Spectral field validation: ${{ needs.validate-spectral-field.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Experiments: ${{ needs.run-experiments.result }}" >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "*Instituto Consciencia Cuántica QCAL ∞³*" >> $GITHUB_STEP_SUMMARY
