name: Stationary Phase Monitor — QCAL ∞³

on:
  # Activación manual con parámetros configurables
  workflow_dispatch:
    inputs:
      duration_h:
        description: 'Duración de monitorización (horas)'
        required: false
        default: '24'
        type: string
      interval_min:
        description: 'Intervalo entre mediciones (minutos)'
        required: false
        default: '10'
        type: string
      injection_pct:
        description: 'Nivel de inyección relativo (0.10 = +10%)'
        required: false
        default: '0.10'
        type: string
      snr:
        description: 'SNR base de la señal sintética'
        required: false
        default: '8.0'
        type: string
      seed:
        description: 'Semilla aleatoria (reproducibilidad)'
        required: false
        default: '42'
        type: string

  # Fase 1: Inicio de monitorización estacionaria (diario a las 06:00 UTC)
  schedule:
    - cron: '0 6 * * *'

  # También en PRs para validar el script sin ejecutar la monitorización completa
  pull_request:
    paths:
      - 'scripts/monitor_stationary_phase.py'
      - 'scripts/test_monitor_stationary_phase.py'
      - '.github/workflows/stationary-phase-monitor.yml'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Tests unitarios (siempre, duración corta)
  # ──────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: Tests Unitarios
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tests_passed: ${{ steps.run_tests.outputs.passed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pandas || true

      - name: Run unit tests
        id: run_tests
        run: |
          cd scripts
          python -m pytest test_monitor_stationary_phase.py -v \
            --tb=short 2>&1 | tee test_output.txt
          if [ ${PIPESTATUS[0]} -eq 0 ]; then
            echo "passed=true" >> $GITHUB_OUTPUT
          else
            echo "passed=false" >> $GITHUB_OUTPUT
          fi
        continue-on-error: true

      - name: Test summary
        if: always()
        run: |
          echo "## 🧪 Tests Unitarios" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f scripts/test_output.txt ]; then
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -30 scripts/test_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Monitorización estacionaria
  # ──────────────────────────────────────────────────────────────────────────
  stationary-monitor:
    name: Fase Estacionaria 24h
    runs-on: ubuntu-latest
    needs: unit-tests
    permissions:
      contents: read
    # En PRs solo ejecutamos los tests, no la monitorización completa
    if: github.event_name != 'pull_request'
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pandas

      - name: Resolve monitoring parameters
        id: params
        run: |
          DURATION="${{ github.event.inputs.duration_h || '24' }}"
          INTERVAL="${{ github.event.inputs.interval_min || '10' }}"
          INJECTION="${{ github.event.inputs.injection_pct || '0.10' }}"
          SNR="${{ github.event.inputs.snr || '8.0' }}"
          SEED="${{ github.event.inputs.seed || '42' }}"
          echo "duration=${DURATION}" >> $GITHUB_OUTPUT
          echo "interval=${INTERVAL}" >> $GITHUB_OUTPUT
          echo "injection=${INJECTION}" >> $GITHUB_OUTPUT
          echo "snr=${SNR}" >> $GITHUB_OUTPUT
          echo "seed=${SEED}" >> $GITHUB_OUTPUT
          echo "### ⚙️ Parámetros de monitorización" >> $GITHUB_STEP_SUMMARY
          echo "| Parámetro | Valor |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Duración | ${DURATION} h |" >> $GITHUB_STEP_SUMMARY
          echo "| Intervalo | ${INTERVAL} min |" >> $GITHUB_STEP_SUMMARY
          echo "| Inyección | +$(python3 -c "print(f'{float(\"$INJECTION\")*100:.0f}')") % |" >> $GITHUB_STEP_SUMMARY
          echo "| SNR base | ${SNR} |" >> $GITHUB_STEP_SUMMARY
          echo "| Semilla | ${SEED} |" >> $GITHUB_STEP_SUMMARY

      - name: Run stationary phase monitor
        id: monitor
        run: |
          cd scripts
          python monitor_stationary_phase.py \
            --duration ${{ steps.params.outputs.duration }} \
            --interval ${{ steps.params.outputs.interval }} \
            --injection ${{ steps.params.outputs.injection }} \
            --snr      ${{ steps.params.outputs.snr }} \
            --seed     ${{ steps.params.outputs.seed }} \
            --output   stationary_phase_report.json \
            --csv      stationary_phase_log.csv \
            2>&1 | tee monitor_output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          # Extraer veredicto del JSON
          if [ -f stationary_phase_report.json ]; then
            VERDICT=$(python -c "import json; d=json.load(open('stationary_phase_report.json')); print(d['stability_verdict'])")
            echo "verdict=${VERDICT}" >> $GITHUB_OUTPUT
          else
            echo "verdict=UNKNOWN" >> $GITHUB_OUTPUT
          fi
          exit $EXIT_CODE
        continue-on-error: true

      - name: Generate stability report
        if: always()
        run: |
          echo "## 📊 Monitor Fase Estacionaria QCAL ∞³" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          VERDICT="${{ steps.monitor.outputs.verdict }}"
          if [ "$VERDICT" = "STABLE" ]; then
            echo "### ✅ Veredicto: ESTABLE" >> $GITHUB_STEP_SUMMARY
          elif [ "$VERDICT" = "UNSTABLE" ]; then
            echo "### ❌ Veredicto: INESTABLE" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Veredicto: DESCONOCIDO" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f scripts/stationary_phase_report.json ]; then
            echo "#### Resumen estadístico" >> $GITHUB_STEP_SUMMARY
            python3 - <<'PYEOF'
          import json, os, sys
          path = "scripts/stationary_phase_report.json"
          if not os.path.exists(path):
              print("Informe no disponible")
              sys.exit(0)
          d = json.load(open(path))
          s = d["summary"]
          p = d["parameters"]
          lines = [
              f"| Métrica | Valor |",
              f"| --- | --- |",
              f"| Ventanas totales | {s['n_windows']} |",
              f"| Ventanas estables | {s['n_stable']} ({s['pct_stable']:.1f}%) |",
              f"| Ψ media | {s['psi_mean']:.6f} |",
              f"| Ψ mínima | {s['psi_min']:.6f} |",
              f"| Ψ máxima | {s['psi_max']:.6f} |",
              f"| Ψ std | {s['psi_std']:.2e} |",
              f"| f media | {s['f_mean']:.6f} Hz |",
              f"| max |Δf| | {s['max_abs_delta_f_mhz']:.4f} mHz |",
              f"| Umbral Ψ | {p['psi_threshold']} |",
              f"| Umbral |Δf| | {p['freq_deviation_threshold_mhz']:.3f} mHz |",
          ]
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/stdout"), "a") as f:
              f.write("\n".join(lines) + "\n")
          PYEOF
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f scripts/monitor_output.txt ]; then
            echo "<details><summary>Log completo</summary>" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            cat scripts/monitor_output.txt >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "</details>" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Upload monitoring artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stationary-phase-report-${{ github.run_number }}
          path: |
            scripts/stationary_phase_report.json
            scripts/stationary_phase_log.csv
            scripts/stationary_phase_report_plot.png
          retention-days: 30
          if-no-files-found: warn

      - name: Fail on instability
        if: steps.monitor.outputs.verdict == 'UNSTABLE'
        run: |
          echo "❌ El sistema no superó los criterios de fase estacionaria."
          echo "   Ψ debe ser > 0.999990 y |Δf| < 0.05 mHz en todas las ventanas."
          exit 1
