name: QCAL Hilo A — Lean 4 Verification

on:
  push:
    branches: [ main ]
    paths:
      - 'formalization/lean/**'
      - '.github/workflows/lean_verify.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean-compile:
    name: Lean 4 QCAL Symbio Bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Lean
        uses: leanprover/lean-action@v1.6.1
      - name: Build QCAL Symbio Bridge
        working-directory: formalization/lean
        run: lake build QCAL.QcalSymbioBridge
