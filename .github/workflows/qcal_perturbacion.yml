name: QCAL Perturbación ΔP

on:
  workflow_dispatch:
    inputs:
      delta_p:
        description: 'ΔP/P_th ratio (e.g. 0.10 for +10%)'
        required: false
        default: '0.10'
      chi:
        description: 'Grid coupling coefficient χ (Ψ→red, default 1e-3)'
        required: false
        default: '1e-3'
  schedule:
    # Cada 6 horas (respeta escala temporal de Ψ en resonancia activa)
    - cron: '0 */6 * * *'
  push:
    paths:
      - 'scripts/protocolo_perturbacion_dp.py'
      - 'scripts/test_protocolo_perturbacion_dp.py'
      - 'scripts/monitor_qcal.py'
      - '.github/workflows/qcal_perturbacion.yml'

permissions:
  contents: read

jobs:
  perturbacion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy pytest matplotlib

      - name: Run protocolo ΔP (+10%)
        run: |
          python scripts/protocolo_perturbacion_dp.py \
            --delta-p ${{ github.event.inputs.delta_p || '0.10' }} \
            --chi ${{ github.event.inputs.chi || '1e-3' }} \
            --f0 141.7001 \
            --p-th 1.0 \
            --seed 42 \
            --plot \
            --output artifact.json

      - name: Run monitor
        run: |
          python scripts/monitor_qcal.py --artifact artifact.json

      - name: Run falsabilidad tests
        run: |
          pytest scripts/test_protocolo_perturbacion_dp.py -v

      - name: Validate Ψ threshold
        run: |
          python -c "
          import json, sys
          with open('artifact.json') as f:
              data = json.load(f)
          psi = data['coherencia']
          threshold = data.get('threshold_psi', 0.999990)
          print(f'Ψ = {psi}, threshold = {threshold}')
          if psi < threshold:
              print(f'::error::Ψ {psi} below threshold {threshold}')
              sys.exit(1)
          print(f'✅ Ψ = {psi}: VALIDATED')
          "

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qcal-perturbacion-${{ github.run_id }}
          path: |
            artifact.json
            plots/
          retention-days: 30
