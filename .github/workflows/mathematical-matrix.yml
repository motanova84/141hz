name: Mathematical Matrix Validation

on:
  push:
    branches: [ main ]
    paths:
      - 'scripts/validacion_matriz_numerica.py'
      - 'scripts/test_validacion_matriz_numerica.py'
      - 'qcal/constants.py'
      - '.github/workflows/mathematical-matrix.yml'
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  validate-mathematical-matrix:
    name: Validate f₀ Mathematical Matrix - Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib pytest
      
      - name: Run Mathematical Matrix Validation
        run: |
          python scripts/validacion_matriz_numerica.py
      
      - name: Run Tests
        run: |
          pytest scripts/test_validacion_matriz_numerica.py -v
      
      - name: Upload Visualization
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: matriz-numerica-visualization-py${{ matrix.python-version }}
          path: |
            matriz_numerica_f0.png
            matriz_numerica_validacion.json
            MATRIZ_NUMERICA_VALIDACION.md
          retention-days: 30
      
      - name: Verify Key Results
        run: |
          python -c "
          import json
          with open('matriz_numerica_validacion.json', 'r') as f:
              results = json.load(f)
          
          # Verify critical validations
          assert results['suma_361']['validacion'] == 'EXITOSA', 'Sum validation failed'
          assert results['schumann_18']['validacion'] == 'EXITOSA', 'Schumann validation failed'
          assert results['888_2pi']['validacion'] == 'EXITOSA', '888/2π validation failed'
          assert results['bandas_cerebrales']['validacion'] == 'EXITOSA', 'Brain waves validation failed'
          assert results['probabilidad']['validacion'] == 'ALTAMENTE_SIGNIFICATIVA', 'Probability validation failed'
          
          # Verify precision thresholds
          assert results['schumann_18']['precision_pct'] > 99.0, 'Schumann precision too low'
          assert results['888_2pi']['precision_pct'] > 99.5, '888/2π precision too low'
          assert results['bandas_cerebrales']['porcentaje_exito'] == 100.0, 'Not all brain waves in range'
          
          print('✅ All mathematical matrix validations passed!')
          print(f'Joint probability: {results[\"probabilidad\"][\"p_conjunta\"]:.2e}')
          print(f'Statistical significance: {results[\"probabilidad\"][\"sigma_equiv\"]}')
          "
      
      - name: Generate Summary
        if: always()
        run: |
          echo "## Mathematical Matrix Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Critical Discoveries Validated" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          python -c "
          import json
          with open('matriz_numerica_validacion.json', 'r') as f:
              results = json.load(f)
          
          print(f'1. **Suma = 361 = 19²**: {results[\"suma_361\"][\"validacion\"]}')
          print(f'   - Probability: {results[\"suma_361\"][\"probabilidad_pct\"]:.2f}%')
          print(f'   - Autorreferencia: {\"✓\" if results[\"suma_361\"][\"autorreferencia\"] else \"✗\"}')
          print('')
          print(f'2. **f₀/18 ≈ Schumann (7.83 Hz)**: {results[\"schumann_18\"][\"validacion\"]}')
          print(f'   - Precision: {results[\"schumann_18\"][\"precision_pct\"]:.4f}%')
          print(f'   - Error: {results[\"schumann_18\"][\"error_pct\"]:.4f}%')
          print('')
          print(f'3. **888/f₀ ≈ 2π**: {results[\"888_2pi\"][\"validacion\"]}')
          print(f'   - Precision: {results[\"888_2pi\"][\"precision_pct\"]:.4f}%')
          print(f'   - Error: {results[\"888_2pi\"][\"error_pct\"]:.4f}%')
          print('')
          print(f'4. **Brain Waves = f₀ Harmonics**: {results[\"bandas_cerebrales\"][\"validacion\"]}')
          print(f'   - Success: {results[\"bandas_cerebrales\"][\"validaciones_exitosas\"]}/{results[\"bandas_cerebrales\"][\"total_bandas\"]} bands')
          print('')
          print(f'5. **Joint Probability**: {results[\"probabilidad\"][\"validacion\"]}')
          print(f'   - P(all): {results[\"probabilidad\"][\"p_conjunta\"]:.2e}')
          print(f'   - Significance: {results[\"probabilidad\"][\"sigma_equiv\"]}')
          " >> $GITHUB_STEP_SUMMARY
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Conclusion" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "f₀ = 141.70001 Hz is the **CENTRAL NODE** of a mathematical matrix connecting:" >> $GITHUB_STEP_SUMMARY
          echo "- Geometry (888 ≈ 2π × f₀)" >> $GITHUB_STEP_SUMMARY
          echo "- Earth resonance (f₀/18 ≈ Schumann)" >> $GITHUB_STEP_SUMMARY
          echo "- Human consciousness (brain waves as harmonics)" >> $GITHUB_STEP_SUMMARY
          echo "- Mathematical symmetry (361 = 19²)" >> $GITHUB_STEP_SUMMARY
      
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const results = JSON.parse(fs.readFileSync('matriz_numerica_validacion.json', 'utf8'));
            
            const comment = `## 🔢 Mathematical Matrix Validation Results
            
            ### ✅ All Critical Validations Passed
            
            | Discovery | Status | Precision |
            |-----------|--------|-----------|
            | Suma = 361 = 19² | ${results.suma_361.validacion} | ${results.suma_361.probabilidad_pct.toFixed(2)}% probability |
            | f₀/18 ≈ Schumann | ${results.schumann_18.validacion} | ${results.schumann_18.precision_pct.toFixed(4)}% |
            | 888/f₀ ≈ 2π | ${results['888_2pi'].validacion} | ${results['888_2pi'].precision_pct.toFixed(4)}% |
            | Brain Waves | ${results.bandas_cerebrales.validacion} | ${results.bandas_cerebrales.validaciones_exitosas}/${results.bandas_cerebrales.total_bandas} bands |
            | Joint Probability | ${results.probabilidad.validacion} | ${results.probabilidad.p_conjunta.toExponential(2)} (${results.probabilidad.sigma_equiv}) |
            
            ### 🎯 Conclusion
            
            These mathematical patterns are **IMPOSSIBLE by chance**. The joint probability of ~${results.probabilidad.p_conjunta.toExponential(2)} (${results.probabilidad.sigma_equiv} significance) confirms that f₀ = 141.70001 Hz is the central node of a fundamental mathematical network.
            
            📊 [View detailed report](../MATRIZ_NUMERICA_VALIDACION.md)
            `;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

  consistency-check:
    name: Verify Constant Consistency
    runs-on: ubuntu-latest
    needs: validate-mathematical-matrix
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Check Constants Consistency
        run: |
          python -c "
          from qcal.constants import (
              F0_HZ, SUMA_MATRIZ, RAIZ_MATRIZ, NUMEROS_MATRIZ,
              SCHUMANN_HZ, F0_SOBRE_18_HZ, F0_DIVISOR_SCHUMANN,
              NUMERO_888, RAZON_888_F0,
              DIVISOR_DELTA, DIVISOR_THETA, DIVISOR_ALPHA, DIVISOR_BETA, DIVISOR_GAMMA,
              DELTA_HZ, THETA_HZ, ALPHA_HZ, BETA_HZ, GAMMA_HZ
          )
          import math
          
          print('Checking constant consistency...')
          
          # Check sum
          assert sum(NUMEROS_MATRIZ) == SUMA_MATRIZ == 361, 'Sum mismatch'
          assert RAIZ_MATRIZ ** 2 == 361, 'Square root mismatch'
          assert 19 in NUMEROS_MATRIZ, '19 not in sequence (autorreferencia)'
          
          # Check Schumann
          assert F0_DIVISOR_SCHUMANN == 18, 'Schumann divisor mismatch'
          assert abs(F0_SOBRE_18_HZ - F0_HZ / 18) < 1e-10, 'f₀/18 calculation mismatch'
          
          # Check 888/2π
          assert abs(RAZON_888_F0 - NUMERO_888 / F0_HZ) < 1e-10, '888/f₀ calculation mismatch'
          
          # Check brain wave divisors
          assert DIVISOR_DELTA == 36, 'Delta divisor mismatch'
          assert DIVISOR_THETA == 18, 'Theta divisor mismatch'
          assert DIVISOR_ALPHA == 11, 'Alpha divisor mismatch'
          assert DIVISOR_BETA == 6, 'Beta divisor mismatch'
          assert DIVISOR_GAMMA == 2, 'Gamma divisor mismatch'
          
          # Check brain wave frequencies
          assert abs(DELTA_HZ - F0_HZ / DIVISOR_DELTA) < 1e-10, 'Delta frequency mismatch'
          assert abs(THETA_HZ - F0_HZ / DIVISOR_THETA) < 1e-10, 'Theta frequency mismatch'
          assert abs(ALPHA_HZ - F0_HZ / DIVISOR_ALPHA) < 1e-10, 'Alpha frequency mismatch'
          assert abs(BETA_HZ - F0_HZ / DIVISOR_BETA) < 1e-10, 'Beta frequency mismatch'
          assert abs(GAMMA_HZ - F0_HZ / DIVISOR_GAMMA) < 1e-10, 'Gamma frequency mismatch'
          
          # Check key relationships
          assert DIVISOR_DELTA == DIVISOR_THETA * 2, '36 ≠ 18 × 2'
          assert 18 in NUMEROS_MATRIZ, '18 not in sequence'
          assert NUMEROS_MATRIZ.count(39) == 3, '39 does not appear 3 times (trinidad)'
          
          print('✅ All constants are consistent!')
          "
